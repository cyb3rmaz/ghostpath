name: Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-linux:
    name: Build Linux Release Packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            desktop-file-utils \
            appstream \
            libfuse2 \
            curl

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: UI/package-lock.json

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build UI
        run: |
          cd UI
          npm install --legacy-peer-deps
          npm run build

      - name: Build Release Binaries
        run: cargo build --release --workspace

      - name: Install appimagetool
        run: |
          sudo curl -sL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool
          cd /tmp
          /usr/local/bin/appimagetool --appimage-extract
          sudo cp -r squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
          rm -rf squashfs-root

      - name: Package .deb and AppImage
        run: |
          chmod +x scripts/build_all_packages.sh packaging/build-deb.sh packaging/appimage/build-appimage.sh packaging/appimage/AppRun
          ./scripts/build_all_packages.sh
          cd dist
          sha256sum *.deb *.AppImage > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS.txt
