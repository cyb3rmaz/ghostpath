[package]
name = "ghostpath-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Privileged system daemon for GhostPath VPN"

[lints]
workspace = true

[[bin]]
name = "ghostpathd"
path = "src/main.rs"

[dependencies]
ghostpath-core = { workspace = true }
ghostpath-proto = { workspace = true }
ghostpath-tun = { workspace = true }
ghostpath-net = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
