[workspace]
members = [
    "crates/ghostpath-core",
    "crates/ghostpath-proto",
    "crates/ghostpath-tun",
    "crates/ghostpath-net",
    "crates/ghostpath-daemon",
    "crates/ghostpath-cli",
    "crates/ghostpath-gui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.lints.cargo]
unused_dependencies = "allow"

[workspace.lints.rust]
unused_imports = "warn"
dead_code = "allow"

[workspace.dependencies]
# Internal crates
ghostpath-core = { path = "crates/ghostpath-core" }
ghostpath-proto = { path = "crates/ghostpath-proto" }
ghostpath-tun = { path = "crates/ghostpath-tun" }
ghostpath-net = { path = "crates/ghostpath-net" }

# Async runtime & networking
tokio = { version = "1.43", features = ["full"] }
bytes = "1.10"
async-trait = "0.1"

# Serialization & configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
url = "2.5"
base64 = "0.22"
uuid = { version = "1.11", features = ["v4", "serde"] }

# Logging & error handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
anyhow = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# CLI & UX
clap = { version = "4.5", features = ["derive", "env"] }
tabled = "0.17"
colored = "3.0"

# Linux system & Netlink
nix = { version = "0.29", features = ["socket", "signal", "fs", "user", "net"] }
